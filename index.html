    <style>
      /* Pre-render progressive skeleton styling for instant paint (FCP < 50ms) */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050811;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #f1f5f9;
      }
      #glass-prerender-shell {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        user-select: none;
        overflow: hidden;
      }
      .prerender-topbar {
        height: 32px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
      }
      .prerender-topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .prerender-desktop {
        flex: 1;
        position: relative;
        padding: 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
        grid-auto-rows: 96px;
        gap: 16px;
        align-content: start;
      }
      .prerender-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 8px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .prerender-icon-box {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(147, 51, 234, 0.3));
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .prerender-icon-label {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      .prerender-center-badge {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 36px;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }
      .prerender-logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .prerender-taskbar {
        height: 48px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 16px;
      }
      .prerender-dock-item {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="root">

            </div>
          </div>
        </main>

        <footer class="prerender-taskbar">
          <div class="prerender-dock-item" style="background: rgba(59,130,246,0.25);"></div>
          <div class="prerender-dock-item"></div>
          <div class="prerender-dock-item"></div>
          <div class="prerender-dock-item"></div>
          <div class="prerender-dock-item"></div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
